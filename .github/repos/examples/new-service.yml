# ============================================================
# EXAMPLE — repo-level override
# ============================================================
# This file is in a subdirectory and is IGNORED by safe-settings.
# Copy it to .github/repos/<your-repo-name>.yml to activate it.
#
# Repo-level settings are merged on top of suborg + org settings.
# Only include keys you want to OVERRIDE — everything else inherits.
# ============================================================

# --- Force-create the repo if it doesn't exist yet ---
# Useful for bootstrapping: push this file, safe-settings creates the repo.
repository:
  force_create: true # Create the repo if it doesn't exist in the org
  # template: template-service  # Uncomment to initialize from a template repo
  description: "Short description shown on GitHub"
  homepage: ""
  topics:
    - nodejs
    - api
  # Override visibility (defaults to org-level public)
  # private: true
  # visibility: private

# --- Teams ---
# Override team access for this specific repo.
# Useful for: giving a specific team admin on their own service.
teams:
  - name: engineering
    permission: push
  - name: platform
    permission: admin
  # Example: give a specific sub-team write access to their service
  # - name: payments-team
  #   permission: push

# --- Collaborators ---
# Add specific GitHub users (outside the org or for special cases).
# Cannot grant admin — enforced by deployment-settings.yml configvalidator.
# collaborators:
#   - username: contractor-github-handle
#     permission: push
#     include:
#       - this-repo-only

